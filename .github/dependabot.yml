version: 2
# Minor and patch updates arrive grouped and weekly: few PRs, few CI runs.
# Major versions are not proposed (2026-11-16): each one is planned work (TypeScript 7,
# ESLint 10, Postgres 18 needs a database upgrade, Redis 8 new defaults), done on purpose in its
# own branch, not merged from a bot PR. Security updates still arrive for any version.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next', '@next/*']
        update-types: [minor, patch]
      prisma:
        patterns: ['prisma', '@prisma/*']
        update-types: [minor, patch]
      testing:
        patterns: ['vitest', 'vite', '@playwright/test', '@axe-core/*', 'embedded-postgres']
        update-types: [minor, patch]
      lint:
        patterns:
          ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*', 'prettier', 'typescript']
        update-types: [minor, patch]
      everything-else:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Sao_Paulo }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']

  # Base images (Dockerfile) and the infrastructure images (production compose file)
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Sao_Paulo }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      base-images:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /docker
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: America/Sao_Paulo }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # nginx: odd minor versions are the mainline line; production follows stable (1.28, 1.30…)
      - dependency-name: nginx
        versions: ['1.29.x', '1.31.x', '1.33.x']
    groups:
      infra-images:
        patterns: ['*']
        update-types: [minor, patch]
