# Local development databases only (Phase 1). Production compose (web, worker, nginx) is Phase 5.
#   docker compose -f docker/compose.dev.yml up -d
# Ports are bound to 127.0.0.1 only. Development passwords — never reuse them anywhere else.
name: wiskiflix-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev-postgres
      TZ: UTC
      PGTZ: UTC
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
