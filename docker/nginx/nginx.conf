# Wiskiflix — nginx main config (Phase 5), mounted read-only over the image's /etc/nginx/nginx.conf.
# The site itself is docker/nginx/templates/wiskiflix.conf.template (→ /etc/nginx/conf.d).
user nginx;
worker_processes 1;            # 2 vCPU shared with the app; one worker handles this traffic
worker_rlimit_nofile 4096;
pid /var/run/nginx/nginx.pid;  # a tmpfs (read-only root filesystem)
error_log /var/log/nginx/error.log warn;  # → stderr in the official image

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  charset utf-8;
  sendfile on;
  tcp_nopush on;

  # No query strings (order links carry tokens in the path only via POST bodies, but to be safe
  # nothing after "?" is logged) and no client IP beyond what Cloudflare already knows: the app
  # keeps its own hashed IP buckets (05 §11).
  log_format wf escape=json '{"t":"$time_iso8601","m":"$request_method","u":"$uri",'
                            '"s":$status,"b":$body_bytes_sent,"rt":$request_time,'
                            '"id":"$request_id","cf":"$http_cf_ray"}';
  access_log /var/log/nginx/access.log wf;   # → stdout in the official image

  client_body_temp_path /var/cache/nginx/body;
  proxy_temp_path /var/cache/nginx/proxy;
  fastcgi_temp_path /var/cache/nginx/fastcgi;
  uwsgi_temp_path /var/cache/nginx/uwsgi;
  scgi_temp_path /var/cache/nginx/scgi;

  include /etc/nginx/conf.d/*.conf;
}
