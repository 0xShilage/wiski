# ─────────────────────────────────────────────────────────────────────────────
# Processed images (docs/phase-0/11-redesign-spec.md §5). Include INSIDE the media location,
# after the security headers:
#
#   location /media/ {
#     alias /var/lib/wiski/media/;              # MEDIA_DIR volume (read-only for nginx)
#     include snippets/security-headers.conf;
#     include snippets/media.conf;
#   }
#
# Static files only — never proxied to the app. Only the names the media pipeline writes
# (<128-bit content hash>-<width>.<avif|webp>) exist; anything else is a 404 without touching
# the disk. Verified by tests/e2e/headers.spec.ts.
# ─────────────────────────────────────────────────────────────────────────────
if ($uri !~ "^/media/[0-9a-f]{32}-[0-9]{2,4}\.(avif|webp)$") { return 404; }
limit_except GET { deny all; }
autoindex off;
disable_symlinks on;
types { image/avif avif; image/webp webp; }
default_type application/octet-stream;
add_header Cache-Control "public, max-age=31536000, immutable" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
