# Mercado Pago notifications (Phase 2, 05 §6). Small JSON bodies only.
# Mercado Pago signs ITS OWN x-request-id (HMAC manifest "id:…;request-id:…;ts:…;"), so this
# location must pass that header through instead of replacing it with nginx's $request_id —
# otherwise every notification fails the signature check. Defining proxy_set_header here stops
# the server-level ones from being inherited, so all of them are repeated.
client_max_body_size 16k;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-Id $http_x_request_id;
proxy_set_header X-Forwarded-Proto https;
