# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Authenticated Origin Pulls (08 §4): nginx only completes a TLS handshake with a
# client certificate signed by Cloudflare's origin-pull CA, so the server's IP is useless to
# anyone who finds it. Turn on "Authenticated Origin Pulls" (zone-level) in Cloudflare › SSL/TLS ›
# Origin Server BEFORE deploying this, or every request fails with 400.
# The CA file is public: https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/
# (scripts/ops/server-setup.sh downloads it to /etc/wiskiflix/tls/origin-pull-ca.pem).
# ─────────────────────────────────────────────────────────────────────────────
ssl_client_certificate /etc/nginx/tls/origin-pull-ca.pem;
ssl_verify_client on;
