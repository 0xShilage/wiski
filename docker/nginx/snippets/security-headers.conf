# ─────────────────────────────────────────────────────────────────────────────
# Security headers OWNED BY NGINX (docs/phase-0/05-threat-model.md §7).
# Include this file in EVERY location that uses add_header (nginx does not inherit add_header
# into a location that defines its own). Upstream copies are hidden first, so each header
# appears exactly once even if a library adds one. CSP, Reporting-Endpoints, cookies and the
# dynamic Cache-Control are owned by the app; Cloudflare adds none of these (Managed Transforms
# "Add security headers" OFF, Cloudflare HSTS OFF).
# Verified by tests/e2e/headers.spec.ts (Phase 1, against this file) and scripts/check-headers.sh
# (Phase 5, production).
# ─────────────────────────────────────────────────────────────────────────────
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Powered-By;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Trailer player (11 §6): autoplay/encrypted-media/fullscreen/picture-in-picture for self and the
# youtube-nocookie origin only (the iframe's `allow` attribute delegates exactly these).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=(), clipboard-write=(self), autoplay=(self \"https://www.youtube-nocookie.com\"), encrypted-media=(self \"https://www.youtube-nocookie.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\"), picture-in-picture=(self \"https://www.youtube-nocookie.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
