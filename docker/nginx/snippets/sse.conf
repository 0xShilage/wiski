# Server-Sent Events (Phase 2: /api/v1/orders/*/events, /api/v1/campaigns/*/events).
# Streamed as they are written; the app sends a heartbeat every 20 s (Cloudflare idles at 100 s)
# and ends a stream after 15 min (EventSource reconnects by itself).
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 60s;
proxy_set_header Connection "";
chunked_transfer_encoding on;
