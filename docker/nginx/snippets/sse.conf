# Server-Sent Events (Phase 2: /api/v1/orders/*/events, /api/v1/campaigns/*/events).
# Streamed as they are written; the app sends a heartbeat every 20 s (Cloudflare idles at 100 s)
# and ends a stream after 15 min (EventSource reconnects by itself). No proxy_set_header here:
# the server-level headers (Host, X-Real-IP, X-Request-Id, …) must keep being inherited.
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 60s;
