# ─────────────────────────────────────────────────────────────────────────────
# TLS between Cloudflare and this server (Mozilla "intermediate", 2026): TLS 1.2 + 1.3,
# forward-secret AEAD ciphers only. Visitors' TLS is terminated by Cloudflare (min TLS 1.2,
# TLS 1.3 on — 08 §4); this is the origin leg, which Cloudflare reaches in Full (strict) mode.
# ─────────────────────────────────────────────────────────────────────────────
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_session_timeout 1d;
ssl_session_cache shared:wf_tls:10m;
ssl_session_tickets off;
