# ─────────────────────────────────────────────────────────────────────────────
# Image upload endpoint (11 §5, §9) — the ONLY location that accepts bodies > 16 KB.
# Include INSIDE an exact-match location, after the security headers:
#
#   # http block:
#   limit_req_zone $binary_remote_addr zone=wf_upload:1m rate=2r/m;
#
#   location = /api/v1/admin/media {
#     include snippets/security-headers.conf;
#     include snippets/upload.conf;
#     proxy_pass http://app;
#   }
#
# nginx buffers the body to client_body_temp_path (disk, not RAM) and only then forwards it, so
# slow uploads never hold an app worker. The app re-checks size, session and role before reading
# the body, and streams it to its own temp file (src/server/media).
# ─────────────────────────────────────────────────────────────────────────────
client_max_body_size 11m;
client_body_buffer_size 64k;
client_body_timeout 30s;
limit_except POST { deny all; }
limit_req zone=wf_upload burst=2 nodelay;
limit_req_status 429;
proxy_read_timeout 60s;
