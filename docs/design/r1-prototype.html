:root{--ink:#1b1225;--plum:#4f3d72;--violet:#736bb2;--lavender:#a99de0;--lilac:#e5dded;
--s1:#241a33;--s2:#2e2141;--s3:#3a2c53;--ok:#7fd6a4;--warn:#f2c46d;
--glow-sm:0 0 6px rgba(169,157,224,.85),0 0 16px rgba(115,107,178,.55);
--glow:0 0 8px rgba(169,157,224,.9),0 0 22px rgba(169,157,224,.55),0 0 48px rgba(115,107,178,.45);
--pad:clamp(20px,8.333vw,160px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--ink);color:var(--lilac);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ── header ── */
.top{position:absolute;inset:40px var(--pad) auto;display:flex;align-items:center;justify-content:space-between;z-index:5}
.logo{height:38px;display:block;filter:drop-shadow(0 0 5px rgba(169,157,224,.75)) drop-shadow(0 0 16px rgba(115,107,178,.6))}
.nav{display:flex;gap:clamp(28px,3.33vw,64px);align-items:flex-start}
.nav a{font-size:18px;color:rgba(229,221,237,.78);padding-bottom:14px;border-bottom:2px solid transparent;transition:color .2s}
.nav a:hover{color:var(--lilac)}
.nav a[aria-current]{color:var(--lilac);border-bottom-color:var(--lavender);box-shadow:0 7px 12px -8px rgba(169,157,224,.95);text-shadow:0 0 12px rgba(169,157,224,.6)}
/* ── hero ── */
.hero{position:relative;min-height:max(100vh,760px);overflow:hidden;isolation:isolate}
.art{position:absolute;inset:0 0 0 auto;width:72%;z-index:-2;background:radial-gradient(120% 90% at 70% 40%,var(--c2) 0%,var(--c1) 55%,var(--ink) 100%)}
.art::before{content:"";position:absolute;inset:0;background:var(--pat) center/420px;opacity:.28;mix-blend-mode:screen}
.art img{position:absolute;right:8%;bottom:30%;height:56%;filter:drop-shadow(0 0 18px rgba(169,157,224,.55)) drop-shadow(0 0 60px rgba(115,107,178,.5))}
.art .tag{position:absolute;right:var(--pad);top:104px;font-size:11px;color:rgba(229,221,237,.45);letter-spacing:.08em}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(27,18,37,.72) 2.7%,rgba(27,18,37,0) 35.9%,rgba(27,18,37,.62) 100%),linear-gradient(90deg,rgba(27,18,37,.94) 33.2%,rgba(27,18,37,0) 80.5%)}
.content{position:relative;padding:211px var(--pad) 0;max-width:calc(470px + 2*var(--pad));z-index:2}
.title{font-family:Escargoth,Poppins,sans-serif;font-weight:400;font-size:clamp(44px,3.75vw + 2px,76px);line-height:.98;letter-spacing:.015em;margin:0;color:#f7f2fb;text-shadow:0 0 22px rgba(169,157,224,.35)}
.meta{display:flex;align-items:center;gap:12px;margin-top:24px;font-size:14px;color:rgba(229,221,237,.82);flex-wrap:wrap}
.age{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:4px;font-weight:700;font-size:12px;color:#fff}
.age.L{background:#0a9e47}.age.a10{background:#0b79c1}.age.a12{background:#f2b400;color:#1b1225}.age.a14{background:#e8701a}.age.a16{background:#d6202a}.age.a18{background:#111}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(229,221,237,.7)}
.sep{width:1px;height:10px;background:rgba(229,221,237,.45)}
.syn{margin:24px 0 0;font-size:16px;line-height:1.6;max-width:470px;color:rgba(229,221,237,.92)}
.syn a{color:var(--lavender);text-decoration:underline;text-underline-offset:3px}
.ctas{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap}
.btn{height:48px;padding:0 28px;border-radius:8px;display:inline-flex;align-items:center;gap:12px;font-weight:500;font-size:16px;border:0;transition:box-shadow .25s,transform .15s}
.btn-ghost{background:rgba(27,18,37,.25);border:1px solid rgba(229,221,237,.6);color:var(--lilac)}
.btn-ghost:hover{border-color:var(--lavender);box-shadow:var(--glow-sm)}
.btn-neon{background:var(--lavender);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),var(--glow)}
.btn-neon:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 0 10px rgba(229,221,237,.95),0 0 28px rgba(169,157,224,.75),0 0 64px rgba(115,107,178,.6)}
.btn img{width:12px;height:12px}
.price{margin-top:14px;font-size:13px;color:rgba(229,221,237,.7)}.price b{color:var(--lilac);font-weight:600}
.arrows{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:0 var(--pad);margin-top:64px}
.arrow{width:40px;height:40px;border-radius:8px;border:1px solid rgba(229,221,237,.7);background:rgba(27,18,37,.35);display:grid;place-items:center}
.arrow:hover{border-color:var(--lavender);box-shadow:var(--glow-sm)}
.count{font-size:14px;color:rgba(229,221,237,.7);font-variant-numeric:tabular-nums;margin-left:8px}.count b{color:var(--lilac)}
.rail{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;display:flex;align-items:flex-end;gap:32px;z-index:2;filter:drop-shadow(0 0 12px rgba(0,0,0,.4))}
.card{position:relative;width:176px;height:234px;border-radius:12px;overflow:hidden;flex:none;background:radial-gradient(110% 80% at 60% 35%,var(--c2),var(--c1) 70%)}
.card::before{content:"";position:absolute;inset:0;background:var(--pat) center/180px;opacity:.22}
.card img{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);height:58%}
.card .ct{position:absolute;inset:auto 10px 12px;font-family:Escargoth,sans-serif;font-size:17px;line-height:1;text-align:center;color:#fff;text-shadow:0 0 8px rgba(169,157,224,.7)}
.card::after{content:"";position:absolute;inset:0;background:rgba(27,18,37,.5)}
.card.on{width:208px;height:277px;outline:2px solid var(--lavender);outline-offset:0;box-shadow:var(--glow)}
.card.on::after{background:rgba(27,18,37,.06)}
.badge{position:absolute;z-index:3;top:10px;left:10px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;letter-spacing:.02em}
.badge.sp{background:var(--lavender);color:var(--ink);box-shadow:var(--glow-sm)}
.badge.rs{background:rgba(27,18,37,.85);color:var(--warn);border:1px solid rgba(242,196,109,.6)}
/* ── trailer modal ── */
.modal{position:fixed;inset:0;background:rgba(10,6,16,.82);display:none;place-items:center;z-index:20;backdrop-filter:blur(6px)}
.modal.open{display:grid}
.player{width:min(960px,92vw);aspect-ratio:16/9;border-radius:14px;background:#000;box-shadow:var(--glow);display:grid;place-items:center;text-align:center;color:rgba(229,221,237,.75);font-size:14px;position:relative}
.player button{position:absolute;top:-48px;right:0}
/* ── mobile ── */
.tabbar{display:none}
@media (max-width:760px){
 .top{inset:16px 20px auto}.logo{height:30px}.nav{display:none}
 .hero{min-height:auto;padding-bottom:24px}
 .art{width:100%;height:470px;inset:0 0 auto 0}
 .art img{right:50%;transform:translateX(50%);bottom:70px;height:62%}
 .art .tag{top:64px;right:16px}
 .shade{height:470px;background:linear-gradient(180deg,rgba(27,18,37,.65) 0%,rgba(27,18,37,0) 30%,rgba(27,18,37,.4) 60%,var(--ink) 100%)}
 .content{padding:330px 20px 0;max-width:none}
 .title{font-size:42px}
 .meta{margin-top:16px;gap:10px;font-size:13px}
 .syn{font-size:15px;margin-top:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .ctas{flex-direction:column;gap:12px;margin-top:24px}.ctas .btn{width:100%;justify-content:center;height:52px}
 .ctas .btn-neon{order:-1}
 .price{text-align:center}
 .arrows{margin-top:28px;padding:0 20px}
 .rail{position:static;transform:none;margin:20px 0 0;padding:6px 20px 18px;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;align-items:center}
 .card{width:124px;height:165px;scroll-snap-align:start}.card.on{width:140px;height:186px}.card .ct{font-size:13px}
 .tabbar{display:flex;position:fixed;inset:auto 0 0 0;height:68px;background:rgba(27,18,37,.96);border-top:1px solid rgba(79,61,114,.8);justify-content:space-around;align-items:center;z-index:10;padding-bottom:4px}
 .tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:rgba(229,221,237,.7);min-width:60px}
 .tabbar svg{width:22px;height:22px}
 .tabbar a[aria-current]{color:var(--lilac);text-shadow:0 0 10px rgba(169,157,224,.8)}
 .tabbar a[aria-current] svg{filter:drop-shadow(0 0 4px rgba(169,157,224,.9))}
 body{padding-bottom:68px}
}
/* ── séries page ── */
.page{padding:140px var(--pad) 80px;position:relative}
.h1{font-family:Escargoth,sans-serif;font-weight:400;font-size:56px;margin:0;letter-spacing:.02em;text-shadow:0 0 18px rgba(169,157,224,.45)}
.lead{margin:12px 0 0;max-width:640px;color:rgba(229,221,237,.82);line-height:1.6}
.feature{margin-top:40px;display:grid;grid-template-columns:1.25fr 1fr;border-radius:18px;overflow:hidden;background:var(--s1);border:1px solid rgba(169,157,224,.35);box-shadow:0 0 0 1px rgba(169,157,224,.12),0 0 40px rgba(115,107,178,.25)}
.feature .fart{position:relative;min-height:360px;background:radial-gradient(120% 90% at 55% 40%,var(--c2),var(--c1) 70%)}
.feature .fart::before{content:"";position:absolute;inset:0;background:var(--pat) center/300px;opacity:.25}
.feature .fart img{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);height:74%;filter:drop-shadow(0 0 16px rgba(169,157,224,.6))}
.feature .finfo{padding:36px 40px}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lavender);font-weight:600}
.ftitle{font-family:Escargoth,sans-serif;font-size:44px;line-height:1;margin:10px 0 8px}
.small{font-size:14px;color:rgba(229,221,237,.75)}
.bar{height:10px;border-radius:999px;background:rgba(79,61,114,.55);overflow:hidden;margin:22px 0 10px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--lavender));box-shadow:0 0 10px rgba(169,157,224,.9),0 0 22px rgba(115,107,178,.7)}
.nums{display:flex;justify-content:space-between;font-size:14px}.nums b{font-size:20px;color:#fff}
.chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.chip{border:1px solid rgba(169,157,224,.45);border-radius:999px;padding:6px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:48px}
.scard{background:var(--s1);border-radius:14px;overflow:hidden;border:1px solid rgba(79,61,114,.8)}
.scard .p{position:relative;aspect-ratio:2/3;background:radial-gradient(110% 80% at 60% 35%,var(--c2),var(--c1) 70%)}
.scard .p::before{content:"";position:absolute;inset:0;background:var(--pat) center/200px;opacity:.22}
.scard .p img{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);height:52%}
.scard .b{padding:16px}
.scard h3{margin:0;font-family:Escargoth,sans-serif;font-weight:400;font-size:24px}
.scard .bar{height:8px;margin:14px 0 8px}
.state{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;margin-top:10px}
.state.funded{background:rgba(127,214,164,.15);color:var(--ok);border:1px solid rgba(127,214,164,.5)}
.state.paused{background:rgba(242,196,109,.12);color:var(--warn);border:1px solid rgba(242,196,109,.5)}
/* ── admin ── */
.admin{display:grid;grid-template-columns:232px 1fr 640px;min-height:100vh;background:#160f1f}
.side{background:var(--s1);border-right:1px solid rgba(79,61,114,.7);padding:24px 18px;display:flex;flex-direction:column;gap:6px}
.side .logo{height:28px;margin:4px 6px 4px}
.side .lbl{font-size:11px;letter-spacing:.14em;color:rgba(229,221,237,.5);text-transform:uppercase;margin:18px 8px 6px}
.side a{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;font-size:14px;color:rgba(229,221,237,.8)}
.side a[aria-current]{background:rgba(169,157,224,.12);color:var(--lilac);box-shadow:inset 3px 0 0 var(--lavender)}
.side a span{color:rgba(229,221,237,.5);font-size:12px}
.side .me{margin-top:auto;font-size:12px;color:rgba(229,221,237,.7);border-top:1px solid rgba(79,61,114,.7);padding:14px 8px 0}
.side .me b{display:block;color:var(--lilac);font-size:13px}
.pk{display:inline-flex;gap:6px;align-items:center;margin-top:6px;color:var(--ok)}
.board{padding:28px 28px}
.bh{display:flex;justify-content:space-between;align-items:center}
.bh h2{margin:0;font-family:Escargoth,sans-serif;font-weight:400;font-size:34px}
.legend{display:flex;gap:14px;font-size:12px;color:rgba(229,221,237,.7);margin:14px 0 18px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.slot{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:radial-gradient(110% 80% at 60% 35%,var(--c2),var(--c1) 70%);border:1px solid rgba(79,61,114,.9)}
.slot img{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);height:46%}
.slot .n{position:absolute;top:5px;left:6px;font-size:10px;color:rgba(255,255,255,.85);font-weight:600}
.slot .st{position:absolute;inset:auto 0 0;font-size:9.5px;text-align:center;padding:3px 0;background:rgba(27,18,37,.8)}
.slot .st.Reservado{color:#f2c46d}.slot .st.Patrocinado{color:#7fd6a4}.slot .st.Assistido{color:#a99de0;font-weight:600}.slot .st.Rascunho{color:rgba(229,221,237,.55)}
.slot.sel{outline:2px solid var(--lavender);box-shadow:var(--glow-sm)}
.slot.empty{background:repeating-linear-gradient(135deg,rgba(79,61,114,.25) 0 6px,transparent 6px 12px);border-style:dashed;display:grid;place-items:center;color:rgba(229,221,237,.55);font-size:20px}
.editor{background:var(--s1);border-left:1px solid rgba(79,61,114,.7);padding:24px 28px;overflow:hidden}
.eh{display:flex;justify-content:space-between;align-items:center}
.eh h3{margin:0;font-size:18px;font-weight:600}
.ver{font-size:12px;color:rgba(229,221,237,.6)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}
.f .full{grid-column:1/-1}
label{display:block;font-size:12px;color:rgba(229,221,237,.75);margin-bottom:5px}
.in{height:38px;border-radius:8px;background:var(--ink);border:1px solid rgba(79,61,114,1);padding:0 12px;display:flex;align-items:center;font-size:14px;color:var(--lilac)}
.in.ta{height:72px;align-items:flex-start;padding-top:9px;line-height:1.45;font-size:13px}
.in.ok{border-color:rgba(127,214,164,.6)}
.hint{font-size:11px;color:rgba(229,221,237,.55);margin-top:4px}.hint.ok{color:var(--ok)}
.calc{font-size:13px;margin-top:4px}.calc b{color:var(--lavender)}
.gen{display:flex;gap:6px;flex-wrap:wrap}.gen span{font-size:12px;border-radius:999px;padding:4px 10px;background:rgba(169,157,224,.14);border:1px solid rgba(169,157,224,.35)}
.imgs{display:grid;grid-template-columns:96px 1fr 120px;gap:12px;margin-top:4px}
.drop{border:1px dashed rgba(169,157,224,.55);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:11px;color:rgba(229,221,237,.65);position:relative;overflow:hidden}
.drop.poster{aspect-ratio:2/3}.drop.back{aspect-ratio:16/9;align-self:start}.drop.lg{aspect-ratio:16/9;align-self:start}
.drop.fill{border-style:solid;background:radial-gradient(110% 80% at 60% 35%,#736bb2,#2e2141 70%)}
.drop.fill img{height:60%}
.drop em{position:absolute;inset:auto 0 0;background:rgba(27,18,37,.85);font-style:normal;padding:3px 0}
.acts{display:flex;gap:10px;margin-top:18px}
.acts .btn{height:40px;font-size:14px;padding:0 16px}
.hist{margin-top:16px;border-top:1px solid rgba(79,61,114,.7);padding-top:12px;font-size:12px;color:rgba(229,221,237,.7)}
.hist div{display:flex;justify-content:space-between;padding:4px 0}.hist a{color:var(--lavender)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const screen = q.get('screen') || 'filmes';
const brl = c => 'R$\u00a0' + (c/100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const hm = m => `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`;
const ageCls = a => a === 'L' ? 'L' : 'a' + a;
let cur = 0;
function header(active){
  const items = [['filmes','Filmes'],['series','Séries'],['franquias','Franquias'],['avaliacoes','Avaliações'],['perfil','Perfil']];
  const tabs = {filmes:'film',series:'tv',franquias:'layers',avaliacoes:'star',perfil:'user'};
  const nav = items.map(([k,l]) => `<a href="?screen=${k}" ${k===active?'aria-current="page"':''}>${l}</a>`).join('');
  const bar = items.map(([k,l]) => `<a href="?screen=${k}" ${k===active?'aria-current="page"':''}>${ICON[tabs[k]]}<span>${l}</span></a>`).join('');
  return `<header class="top"><a href="?screen=filmes" aria-label="Wiski — página inicial"><img class="logo" src="${LOGO}" alt="Wiski"></a><nav class="nav" aria-label="Principal">${nav}</nav></header>
  <nav class="tabbar" aria-label="Principal (celular)">${bar}</nav>`;
}
function filmes(){
  const m = D.movies[cur];
  const total = 35, pos = cur + 1;
  const syn = m.syn || 'Sinopse escrita pela moderação no painel. Até 600 caracteres, sem formatação, exibida aqui com no máximo três linhas e um link para ler mais.';
  const n = D.movies.length, win = [];
  for (let k=-4;k<=4;k++) win.push((cur + k + n) % n);   // active card always in the middle of the rail
  const rail = win.map(i => [D.movies[i], i]).map(([x,i]) => `<div class="card ${i===cur?'on':''}" style="--c1:${x.bg[0]};--c2:${x.bg[1]};--pat:url(${PAT.p2violet})">
      ${x.s==='SPONSORED'?'<span class="badge sp">Patrocinado</span>':''}${x.s==='RESERVED'?'<span class="badge rs">Reservado</span>':''}
      <img src="${x.img}" alt=""><div class="ct">${x.t}</div></div>`).join('');
  const sold = m.s==='SPONSORED', res = m.s==='RESERVED';
  const cta = sold ? `<button class="btn btn-ghost" disabled>Patrocinado ✓</button>` : res ? `<button class="btn btn-ghost" disabled>Reservado — pagamento em andamento</button>`
      : `<a class="btn btn-neon" href="#"><img src="${PONTO_INK}" alt="">Patrocine agora</a>`;
  return `<section class="hero" aria-roledescription="carrossel" aria-label="Filmes escolhidos">
    <div class="art" style="--c1:${m.bg[0]};--c2:${m.bg[1]};--pat:url(${PAT.p1plum})"><img src="${m.img}" alt=""><span class="tag">ARTE ILUSTRATIVA · IMAGEM DO FILME ENVIADA NO PAINEL</span></div><div class="shade"></div>
    ${header('filmes')}
    <div class="content" aria-live="polite">
      <h1 class="title">${m.t}</h1>
      <div class="meta"><span class="age ${ageCls(m.a)}" title="Classificação indicativa">${m.a}</span><span class="dot"></span><span>${m.y}</span><span class="sep"></span><span>${hm(m.r)}</span><span class="sep"></span><span>${m.g}</span></div>
      <p class="syn">${syn} <a href="#">Ver mais</a></p>
      <div class="ctas"><button class="btn btn-ghost" data-trailer>${ICON.play}Assistir trailer</button>${cta}</div>
      <div class="price">${sold ? 'Patrocinado por <b>@luana_v</b> · entra numa das próximas sessões da live' : res ? 'Alguém está pagando o Pix agora · volta a ficar disponível se o Pix expirar (até 35 min)' : `Patrocínio: <b>${brl(m.price)}</b> · <span style="white-space:nowrap">pago por uma pessoa</span> · <span style="white-space:nowrap">${m.r>130?`${m.r-130} min além de 2 h 10 min`:'até 2 h 10 min'}</span>`}</div>
    </div>
    <div class="arrows"><button class="arrow" data-prev aria-label="Filme anterior">${ICON.chev_l}</button><button class="arrow" data-next aria-label="Próximo filme">${ICON.chev_r}</button><span class="count"><b>${String(pos).padStart(2,'0')}</b> / ${total}</span></div>
    <div class="rail">${rail}</div>
  </section>`;
}
function series(){
  const f = D.series[0], pct = Math.round(f.raised*100/f.goal);
  const cards = D.series.slice(1).map(s => { const p = Math.round(s.raised*100/s.goal);
    const state = s.st==='FUNDED' ? '<span class="state funded">Meta atingida ✓ · entra na live</span>' : s.st==='PAUSED' ? '<span class="state paused">Prazo encerrado — aguardando prorrogação</span>' : `<div class="small" style="margin-top:10px">Faltam ${s.days} dias · ${s.backers} apoiadores</div>`;
    return `<article class="scard"><div class="p" style="--c1:${s.bg[0]};--c2:${s.bg[1]};--pat:url(${PAT.p2violet})"><img src="${s.img}" alt=""></div>
      <div class="b"><h3>${s.t}</h3><div class="small">${s.seasons} · ${s.eps} episódios</div><div class="bar"><i style="width:${p}%"></i></div>
      <div class="nums small"><span><b style="font-size:15px">${brl(s.raised)}</b> de ${brl(s.goal)}</span><span>${p}%</span></div>${state}</div></article>`; }).join('');
  return `${header('series')}<main class="page">
    <h1 class="h1">Séries</h1>
    <p class="lead">Campanhas coletivas: cada pessoa contribui com quanto quiser, a partir de R$&nbsp;5. Quando a meta é atingida, a série entra na programação da live.</p>
    <section class="feature"><div class="fart" style="--c1:${f.bg[0]};--c2:${f.bg[1]};--pat:url(${PAT.p3violet})"><img src="${f.img}" alt=""></div>
      <div class="finfo"><div class="kick">Campanha em destaque</div><div class="ftitle">${f.t}</div>
        <div class="small">${f.seasons} · ${f.eps} episódios · <span class="age a14" style="vertical-align:middle">14</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="nums"><span><b>${brl(f.raised)}</b> <span class="small">de ${brl(f.goal)}</span></span><span><b>${pct}%</b></span></div>
        <div class="chips"><span class="chip">Faltam ${f.days} dias</span><span class="chip">${f.backers} apoiadores</span><span class="chip">Mínimo R$&nbsp;5</span></div>
        <div class="ctas" style="margin-top:28px"><button class="btn btn-ghost" data-trailer>${ICON.play}Assistir trailer</button><a class="btn btn-neon" href="#"><img src="${PONTO_INK}" alt="">Contribuir</a></div>
      </div></section>
    <div class="grid">${cards}</div></main>`;
}
function admin(){
  const st = ['Ativo','Ativo','Ativo','Patrocinado','Ativo','Reservado','Ativo','Ativo','Ativo'];
  let slots = '';
  for (let i=0;i<35;i++){ const m = D.movies[i % D.movies.length];
    if (i===31 || i===33) { slots += `<div class="slot empty" title="Vaga livre">＋</div>`; continue; }
    const s = i===3?'Patrocinado':i===5?'Reservado':i===12?'Assistido':i===20?'Rascunho':'Ativo';
    slots += `<div class="slot ${i===0?'sel':''}" style="--c1:${m.bg[0]};--c2:${m.bg[1]}"><span class="n">${String(i+1).padStart(2,'0')}</span><img src="${m.img}" alt=""><span class="st ${s}">${s}</span></div>`; }
  const m = D.movies[0];
  return `<div class="admin">
   <aside class="side"><img class="logo" src="${LOGO}" alt="Wiski"><div class="lbl">Catálogo</div>
     <a href="#" aria-current="page">Filmes <span>33/35</span></a><a href="#">Séries <span>9/10</span></a><a href="#">Franquias <span>4/10</span></a>
     <div class="lbl">Operação</div><a href="#">Campanhas</a><a href="#">Sessões da live</a><a href="#">Moderação <span>3</span></a><a href="#">Auditoria</a>
     <div class="me"><b>@mod_ana · Moderadora</b><span class="pk">● Passkey verificada</span></div></aside>
   <section class="board"><div class="bh"><h2>Filmes</h2><a class="btn btn-neon" href="#" style="height:40px;font-size:14px">＋ Novo filme</a></div>
     <div class="legend"><span><i style="background:#a99de0"></i>Ativo</span><span><i style="background:#f2c46d"></i>Reservado (Pix pendente)</span><span><i style="background:#7fd6a4"></i>Patrocinado</span><span><i style="background:#736bb2"></i>Assistido → substituir</span><span><i style="background:#4f3d72"></i>Rascunho</span><span>Arraste para mudar a ordem do carrossel</span></div>
     <div class="slots">${slots}</div></section>
   <section class="editor" aria-label="Editar filme"><div class="eh"><h3>Editar filme · vaga 01</h3><span class="ver">versão 7 · salvo há 2 min</span></div>
     <div class="f">
      <div class="full"><label>Título</label><div class="in">${m.t}</div></div>
      <div><label>Título original</label><div class="in">The Squirrel's Night</div></div>
      <div><label>Ano</label><div class="in">${m.y}</div></div>
      <div><label>Duração (minutos)</label><div class="in">${m.r}</div><div class="calc">Preço calculado: <b>${brl(m.price)}</b></div></div>
      <div><label>Classificação indicativa</label><div class="in"><span class="age a14" style="margin-right:8px">14</span>14 anos</div></div>
      <div class="full"><label>Gêneros</label><div class="gen"><span>Ficção científica</span><span>Aventura</span><span>＋ adicionar</span></div></div>
      <div class="full"><label>Sinopse <span style="float:right">152 / 600</span></label><div class="in ta">${m.syn}</div></div>
      <div><label>Direção</label><div class="in">Ana Lavanda</div></div>
      <div><label>Elenco principal</label><div class="in">Rui Ameixa, Lia Noite…</div></div>
      <div class="full"><label>Trailer (link do YouTube)</label><div class="in ok">https://youtu.be/xxxxxxxxxxx</div><div class="hint ok">✓ ID válido · o player só carrega quando o visitante clica</div></div>
      <div class="full"><label>Imagens · JPEG, PNG, WebP ou AVIF até 10 MB (SVG não é aceito)</label>
       <div class="imgs"><div class="drop poster fill"><img src="${m.img}" alt=""><em>Pôster 2:3</em></div>
        <div class="drop back fill"><img src="${m.img}" alt=""><em>Fundo 16:9 · mín. 1920×1080</em></div>
        <div class="drop lg">Logo do título<br>(PNG transparente,<br>opcional)</div></div>
       <div class="hint">Toda imagem é reconvertida no servidor e os metadados (EXIF/GPS) são removidos.</div></div>
     </div>
     <div class="acts"><a class="btn btn-ghost" href="#">Ver como visitante</a><a class="btn btn-ghost" href="#">Salvar rascunho</a><a class="btn btn-neon" href="#">Publicar</a></div>
     <div class="hist"><div><span>v7 · hoje 14:02 · @mod_ana · sinopse</span><a href="#">Reverter</a></div><div><span>v6 · hoje 13:40 · @mod_ana · imagem de fundo</span><a href="#">Reverter</a></div></div>
   </section></div>`;
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = screen==='series' ? series() : screen==='admin' ? admin() : filmes();
  app.querySelectorAll('[data-next]').forEach(b => b.onclick = () => { cur = (cur+1) % D.movies.length; render(); });
  app.querySelectorAll('[data-prev]').forEach(b => b.onclick = () => { cur = (cur-1+D.movies.length) % D.movies.length; render(); });
  app.querySelectorAll('[data-trailer]').forEach(b => b.onclick = () => document.getElementById('modal').classList.add('open'));
  const rail = app.querySelector('.rail'), on = app.querySelector('.card.on');
  if (rail && on && matchMedia('(max-width:760px)').matches) rail.scrollLeft = on.offsetLeft - 20;
}
document.addEventListener('keydown', e => { if (screen!=='filmes') return; if (e.key==='ArrowRight') { cur=(cur+1)%D.movies.length; render(); } if (e.key==='ArrowLeft') { cur=(cur-1+D.movies.length)%D.movies.length; render(); } if (e.key==='Escape') document.getElementById('modal').classList.remove('open'); });
render();
</script></body></html>
