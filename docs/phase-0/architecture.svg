<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Poppins, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Wiskiflix architecture (Phase 0 draft)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a99de0"/>
    </marker>
    <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2c46d"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="#1b1225"/>

  <text x="30" y="44" fill="#e5dded" font-size="22" font-weight="700">Wiskiflix — architecture</text>
  <text x="30" y="66" fill="#a99de0" font-size="13">Phase 0 draft · solid = request flow · dashed = callback / verification · TBn = trust boundary</text>

  <!-- Clients -->
  <text x="30" y="132" fill="#a99de0" font-size="12" font-weight="700" letter-spacing="1.5">CLIENTS</text>
  <g font-size="14" fill="#e5dded">
    <rect x="30" y="150" width="180" height="60" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="120" y="176" text-anchor="middle" font-weight="600">Viewer</text>
    <text x="120" y="196" text-anchor="middle" font-size="12" fill="#a99de0">browser · mobile first</text>
    <rect x="30" y="240" width="180" height="60" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="120" y="266" text-anchor="middle" font-weight="600">Streamer / Mod</text>
    <text x="120" y="286" text-anchor="middle" font-size="12" fill="#a99de0">admin · step-up auth</text>
    <rect x="30" y="330" width="180" height="60" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="120" y="356" text-anchor="middle" font-weight="600">OBS overlay</text>
    <text x="120" y="376" text-anchor="middle" font-size="12" fill="#a99de0">key → cookie · SSE</text>
  </g>

  <!-- Cloudflare -->
  <rect x="260" y="130" width="190" height="280" rx="12" fill="none" stroke="#736bb2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="355" y="156" text-anchor="middle" fill="#e5dded" font-size="15" font-weight="700">Cloudflare edge</text>
  <g font-size="12" fill="#a99de0" text-anchor="middle">
    <text x="355" y="184">DNS · edge TLS 1.2 / 1.3</text>
    <text x="355" y="204">DDoS · WAF managed rules</text>
    <text x="355" y="224">rate-limit rules</text>
    <text x="355" y="244">cache: static assets only</text>
    <text x="355" y="264">origin IP hidden</text>
  </g>
  <rect x="275" y="300" width="160" height="56" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
  <text x="355" y="324" text-anchor="middle" fill="#e5dded" font-size="14" font-weight="600">Turnstile</text>
  <text x="355" y="343" text-anchor="middle" fill="#a99de0" font-size="11">bot check on 3 forms</text>

  <!-- VPS -->
  <rect x="490" y="100" width="410" height="560" rx="14" fill="none" stroke="#736bb2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="510" y="126" fill="#e5dded" font-size="15" font-weight="700">VPS · Docker Compose</text>

  <rect x="510" y="145" width="370" height="70" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
  <text x="530" y="172" fill="#e5dded" font-size="14" font-weight="600">nginx</text>
  <text x="530" y="192" fill="#a99de0" font-size="12">origin TLS + mTLS from Cloudflare · security headers</text>
  <text x="530" y="208" fill="#a99de0" font-size="12">limit_req/conn · 16 KB bodies · timeouts · SSE</text>

  <rect x="510" y="250" width="370" height="180" rx="12" fill="none" stroke="#4f3d72" stroke-width="1.5"/>
  <text x="525" y="272" fill="#a99de0" font-size="12" font-weight="700" letter-spacing="1">NEXT.JS 16 IMAGE (one image, two roles)</text>
  <rect x="525" y="285" width="165" height="130" rx="10" fill="#2e2141" stroke="#736bb2" stroke-width="1.5"/>
  <g font-size="12" fill="#a99de0">
    <text x="540" y="308" fill="#e5dded" font-size="14" font-weight="600">web</text>
    <text x="540" y="328">proxy.ts → CSP nonce</text>
    <text x="540" y="346">RSC pages (pt-BR)</text>
    <text x="540" y="364">Route Handlers + guards</text>
    <text x="540" y="382">price engine · auth</text>
    <text x="540" y="400">SSE streams</text>
  </g>
  <rect x="700" y="285" width="165" height="130" rx="10" fill="#2e2141" stroke="#736bb2" stroke-width="1.5"/>
  <g font-size="12" fill="#a99de0">
    <text x="715" y="308" fill="#e5dded" font-size="14" font-weight="600">worker</text>
    <text x="715" y="328">BullMQ consumers</text>
    <text x="715" y="346">payment.sync</text>
    <text x="715" y="364">reconcile · slot expiry</text>
    <text x="715" y="382">stats · e-mail</text>
    <text x="715" y="400">retention purge</text>
  </g>

  <rect x="525" y="480" width="165" height="80" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
  <text x="607" y="508" text-anchor="middle" fill="#e5dded" font-size="14" font-weight="600">Postgres 17</text>
  <text x="607" y="527" text-anchor="middle" fill="#a99de0" font-size="12">system of record</text>
  <text x="607" y="545" text-anchor="middle" fill="#a99de0" font-size="12">CHECKs · audit triggers</text>
  <rect x="700" y="480" width="165" height="80" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
  <text x="782" y="508" text-anchor="middle" fill="#e5dded" font-size="14" font-weight="600">Redis</text>
  <text x="782" y="527" text-anchor="middle" fill="#a99de0" font-size="12">cache · rate limits</text>
  <text x="782" y="545" text-anchor="middle" fill="#a99de0" font-size="12">pub/sub · job queues</text>
  <text x="695" y="595" text-anchor="middle" fill="#a99de0" font-size="12">internal Docker network · no published ports</text>
  <text x="695" y="615" text-anchor="middle" fill="#a99de0" font-size="12">roles: wf_migrator (DDL) · wf_app (DML, audit insert-only)</text>

  <!-- External -->
  <text x="960" y="132" fill="#a99de0" font-size="12" font-weight="700" letter-spacing="1.5">EXTERNAL SERVICES</text>
  <g font-size="14" fill="#e5dded">
    <rect x="960" y="145" width="290" height="48" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="978" y="175" font-weight="600">Google OIDC <tspan fill="#a99de0" font-size="12" font-weight="400">PKCE · state · nonce</tspan></text>
    <rect x="960" y="205" width="290" height="48" rx="10" fill="#241a33" stroke="#f2c46d" stroke-width="1.5"/>
    <text x="978" y="235" font-weight="600">Mercado Pago API <tspan fill="#a99de0" font-size="12" font-weight="400">Pix · refunds</tspan></text>
    <rect x="960" y="265" width="290" height="48" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="978" y="295" font-weight="600">TMDB API <tspan fill="#a99de0" font-size="12" font-weight="400">catalog · cached</tspan></text>
    <rect x="960" y="325" width="290" height="48" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="978" y="355" font-weight="600">YouTube Data API <tspan fill="#a99de0" font-size="12" font-weight="400">video length</tspan></text>
    <rect x="960" y="385" width="290" height="48" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="978" y="415" font-weight="600">Platform stats APIs <tspan fill="#a99de0" font-size="12" font-weight="400">media kit</tspan></text>
    <rect x="960" y="445" width="290" height="48" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="978" y="475" font-weight="600">Transactional e-mail <tspan fill="#a99de0" font-size="12" font-weight="400">contact · notices</tspan></text>
    <rect x="960" y="505" width="290" height="48" rx="10" fill="#241a33" stroke="#4f3d72" stroke-width="1.5"/>
    <text x="978" y="535" font-weight="600">Off-site backups <tspan fill="#a99de0" font-size="12" font-weight="400">encrypted, nightly</tspan></text>
  </g>

  <!-- Flows: clients → Cloudflare → nginx → web -->
  <g stroke="#a99de0" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M210,180 H258"/>
    <path d="M210,270 H258"/>
    <path d="M210,360 H258"/>
    <path d="M450,180 H508"/>
    <path d="M607,215 V283"/>
    <path d="M607,415 V478"/>
    <path d="M782,415 V478"/>
    <path d="M680,415 L745,478"/>
    <path d="M715,415 L650,478"/>
    <path d="M880,340 H925"/>
  </g>
  <!-- egress bus -->
  <g stroke="#a99de0" stroke-width="2" fill="none">
    <path d="M925,169 V529"/>
  </g>
  <g stroke="#a99de0" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M925,169 H958"/><path d="M925,229 H958"/><path d="M925,289 H958"/>
    <path d="M925,349 H958"/><path d="M925,409 H958"/><path d="M925,469 H958"/><path d="M925,529 H958"/>
  </g>
  <text x="960" y="580" fill="#a99de0" font-size="11">egress: HTTPS only, 5–10 s timeouts,</text>
  <text x="960" y="596" fill="#a99de0" font-size="11">retries with backoff + idempotency keys</text>

  <!-- Webhook (dashed, amber) -->
  <path d="M1250,229 H1266 V92 H355 V128" stroke="#f2c46d" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrw)"/>
  <text x="730" y="86" text-anchor="middle" fill="#f2c46d" font-size="12">MP webhook → Cloudflare (WAF skip for this path only) → nginx → web: HMAC verify, enqueue, 200</text>

  <!-- Turnstile siteverify (dashed) -->
  <path d="M523,335 H437" stroke="#a99de0" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="480" y="372" text-anchor="middle" fill="#a99de0" font-size="11">siteverify</text>

  <!-- Trust boundary tags -->
  <g font-size="11" font-weight="700" fill="#1b1225">
    <rect x="216" y="214" width="38" height="20" rx="10" fill="#a99de0"/><text x="235" y="228" text-anchor="middle">TB1</text>
    <rect x="452" y="150" width="54" height="20" rx="10" fill="#a99de0"/><text x="479" y="164" text-anchor="middle">TB2 mTLS</text>
    <rect x="618" y="232" width="38" height="20" rx="10" fill="#a99de0"/><text x="637" y="246" text-anchor="middle">TB3</text>
    <rect x="818" y="438" width="38" height="20" rx="10" fill="#a99de0"/><text x="837" y="452" text-anchor="middle">TB4</text>
    <rect x="890" y="300" width="38" height="20" rx="10" fill="#a99de0"/><text x="909" y="314" text-anchor="middle">TB5</text>
    <rect x="1180" y="100" width="62" height="20" rx="10" fill="#f2c46d"/><text x="1211" y="114" text-anchor="middle">TB6 HMAC</text>
  </g>

  <!-- Footer notes -->
  <g font-size="12" fill="#a99de0">
    <text x="30" y="440" fill="#e5dded" font-weight="600">Header ownership</text>
    <text x="30" y="460">app: CSP (nonce), Reporting-Endpoints,</text>
    <text x="30" y="476">cookies, dynamic Cache-Control</text>
    <text x="30" y="496">nginx: HSTS, XFO, nosniff, Referrer-,</text>
    <text x="30" y="512">Permissions-Policy, COOP, CORP</text>
    <text x="30" y="532">Cloudflare: adds none</text>
    <text x="30" y="572" fill="#e5dded" font-weight="600">Never cached at the edge</text>
    <text x="30" y="592">HTML (nonce per response), /api/*</text>
  </g>
  <text x="30" y="730" fill="#736bb2" font-size="11">Pix QR payloads: Redis only (TTL = expiry). Card/bank data: never touched. Volumetric DDoS is absorbed at Cloudflare; app code cannot stop it.</text>
</svg>
